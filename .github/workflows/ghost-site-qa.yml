name: Ghost site review

on:
  push:
    branches:
      - ghost-v0.2-site-update

permissions:
  contents: read

concurrency:
  group: ghost-site-review
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/ghost-v0.2-site-update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      GHOST_CHECK_EXTERNAL_LINKS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate inspected main without discarding unrelated work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 2cd66423f339c94798c9b353fb9124e9b6b3c9d9
          if ! git merge --no-commit --no-ff origin/main; then
            for path in $(git diff --name-only --diff-filter=U); do
              case "$path" in
                app/page.tsx|app/tools/ghost/page.tsx|app/tools/page.tsx|content/pages.ts|content/locales/de-metadata.ts)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *) echo "Unreviewed merge conflict: $path"; exit 1 ;;
              esac
            done
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/site.spec.ts')
          t = p.read_text()
          assert 'exposes v0.2.0 evidence and fits mobile and desktop' in t
          t = t.replace('page.getByRole("link", { name: "v0.2.0 Release", exact: true }),', 'page.getByRole("link", { name: "v0.2.0 Release", exact: true }).first(),')
          p.write_text(t)
          p = Path('docs/ghost-v0.2-site-evidence.md')
          p.write_text(p.read_text() + '\nThe concurrent main update `2cd66423f339c94798c9b353fb9124e9b6b3c9d9` was reconciled before final validation. Its development launcher and additional browser assertions are preserved. The existing keyboard test now uses structural selectors instead of obsolete copy. External GitHub links are paced and HTTP 429 responses are retried; a rate limit never counts as a successful link check.\n')
          PY
          rm .github/workflows/ghost-site-qa.yml
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and stage final source
        run: |
          pnpm exec prettier --write content/ghost.ts app/tools/ghost/page.tsx app/page.tsx app/tools/page.tsx content/pages.ts content/locales/de-metadata.ts tests/ghost.test.ts tests/e2e/ghost.spec.ts tests/e2e/site.spec.ts docs/ghost-v0.2-site-evidence.md
          git add content/ghost.ts app/tools/ghost/page.tsx app/page.tsx app/tools/page.tsx content/pages.ts content/locales/de-metadata.ts tests/ghost.test.ts tests/e2e/ghost.spec.ts tests/e2e/site.spec.ts docs/ghost-v0.2-site-evidence.md .github/workflows/ghost-site-qa.yml
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Internal links
        run: pnpm links:internal
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Full browser accessibility responsive and external-link tests
        run: pnpm test:e2e
      - name: Verify unrelated files match main
        run: |
          git diff origin/main --exit-code -- package.json pnpm-lock.yaml scripts/dev.mjs app/globals.css app/studio.css app/tools/replay/page.tsx components
          git diff HEAD --check
          git diff origin/main --stat
      - name: Commit tested integration to review branch
        run: |
          test "$GITHUB_REF" = refs/heads/ghost-v0.2-site-update
          git commit -m 'feat: update Ghost site for v0.2.0'
          git push origin HEAD:refs/heads/ghost-v0.2-site-update
          git rev-parse HEAD
      - name: Package final source and screenshots
        if: always()
        run: |
          mkdir -p /tmp/ghost-final-review
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=test-results --exclude=playwright-report -czf /tmp/ghost-final-review/website-source.tar.gz .
          git diff HEAD > /tmp/ghost-final-review/uncommitted.patch
          git status --short > /tmp/ghost-final-review/status.txt
          git rev-parse HEAD > /tmp/ghost-final-review/revision.txt
          if test -d test-results; then cp -R test-results /tmp/ghost-final-review/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ghost-site-final-review
          path: /tmp/ghost-final-review/
          retention-days: 3
