name: Ghost site review

on:
  push:
    branches:
      - ghost-v0.2-site-update

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export formatting tool and installed framework guidance
        run: |
          mkdir -p /tmp/ghost-review
          tar -czf /tmp/ghost-review/prettier.tar.gz -C "$(readlink -f node_modules/prettier)/.." prettier
          if test -d node_modules/next/dist/docs; then
            cp -R node_modules/next/dist/docs /tmp/ghost-review/next-docs
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghost-review-tools
          path: /tmp/ghost-review/
          retention-days: 3
      - name: Baseline formatting
        continue-on-error: true
        run: pnpm format:check
      - name: Baseline lint
        continue-on-error: true
        run: pnpm lint
      - name: Baseline typecheck
        continue-on-error: true
        run: pnpm typecheck
      - name: Baseline tests
        continue-on-error: true
        run: pnpm test
      - name: Baseline build
        continue-on-error: true
        run: pnpm build
