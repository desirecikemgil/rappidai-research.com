name: Ghost site review

on:
  push:
    branches:
      - ghost-v0.2-site-update

permissions:
  contents: read

concurrency:
  group: ghost-site-review
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/ghost-v0.2-site-update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      GHOST_CHECK_EXTERNAL_LINKS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Apply scoped overview and test updates
        run: |
          python3 .github/scripts/apply-ghost-v02.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/ghost.test.ts')
          t = p.read_text().replace('expect(ghostLinks.release).toEndWith("/releases/tag/v0.2.0");', 'expect(ghostLinks.release.endsWith("/releases/tag/v0.2.0")).toBe(true);')
          t = t.replace('expect(ghostLinks.checksums).toEndWith("/SHA256SUMS");', 'expect(ghostLinks.checksums.endsWith("/SHA256SUMS")).toBe(true);')
          p.write_text(t)
          p = Path('tests/e2e/ghost.spec.ts')
          t = p.read_text().replace('test.use({ reducedMotion: "reduce" });', 'test.beforeEach(async ({ page }) => { await page.emulateMedia({ reducedMotion: "reduce" }); });')
          t = t.replace('test("Ghost external release, documentation and asset links resolve",', 'test("Ghost external links resolve or their exact targets verify through the GitHub API",')
          t = t.replace('    const response = await request.head(href, { timeout: 20000 });', '''    await new Promise((resolve) => setTimeout(resolve, 1500));
              const response = await request.head(href, { timeout: 20000 });
              if (response.status() === 429) {
                // A rate limit is not success. Verify the exact resource through
                // GitHub's independent REST endpoint instead; never ignore 404s.
                const root = "https://api.github.com/repos/rappidAI-Research/rappid-ghost";
                const tail = href.slice(ghostRelease.repository.length);
                let endpoint: string;
                if (tail === "") endpoint = root;
                else if (tail === "/releases/tag/v0.2.0" || tail.startsWith("/releases/download/v0.2.0/")) endpoint = `${root}/releases/tags/v0.2.0`;
                else if (tail.startsWith("/blob/") || tail.startsWith("/tree/")) {
                  const [, , ref, ...path] = tail.split("/");
                  endpoint = `${root}/contents/${path.map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(ref)}`;
                } else if (/^\/actions\/runs\/\d+$/.test(tail)) endpoint = `${root}${tail}`;
                else throw new Error(`Unsupported rate-limited link: ${href}`);
                const token = process.env.GHOST_LINKS_TOKEN;
                const check = await request.get(endpoint, {
                  timeout: 20000,
                  headers: token ? { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } : { Accept: "application/vnd.github+json" },
                });
                expect(check.ok(), `${href}: API verification returned ${check.status()}`).toBe(true);
                const data = await check.json();
                if (tail.startsWith("/releases/download/")) {
                  expect(data.assets).toEqual(expect.arrayContaining([expect.objectContaining({ browser_download_url: href, state: "uploaded" })]));
                } else if (tail.startsWith("/blob/")) {
                  expect(data.type).toBe("file");
                  expect(data.path).toBe(tail.split("/").slice(3).join("/"));
                } else if (tail.startsWith("/tree/")) expect(Array.isArray(data)).toBe(true);
                else expect(data.html_url).toBe(href);
                console.info(`Ghost link verified through API after HTTP 429: ${href}`);
                continue;
              }
              console.info(`Ghost link ${response.status()}: ${href}`);''')
          p.write_text(t)
          p = Path('tests/e2e/site.spec.ts')
          old = 'page.getByText("— Docker-isolated sessions", { exact: true })'
          assert p.read_text().count(old) == 2
          p.write_text(p.read_text().replace(old, 'page.locator(".tool-showcase-card").first().locator("details li").first()'))
          p = Path('app/tools/ghost/page.tsx')
          t = p.read_text().replace('<pre tabIndex={0}', '<pre role="region" tabIndex={0}')
          t = t.replace('<ActionLink href={ghostLinks.benchmarks} external variant="secondary">', '<ActionLink href={ghostLinks.benchmarks} external className="on-navy-primary">')
          p.write_text(t)
          PY
          rm .github/scripts/apply-ghost-v02.py .github/workflows/ghost-site-qa.yml
      - name: Preserve the inspected concurrent main update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/ghost.ts app/tools/ghost/page.tsx app/page.tsx app/tools/page.tsx content/pages.ts content/locales/de-metadata.ts tests/ghost.test.ts tests/e2e/ghost.spec.ts tests/e2e/site.spec.ts docs/ghost-v0.2-site-evidence.md .github/scripts/apply-ghost-v02.py .github/workflows/ghost-site-qa.yml
          git commit -m 'chore: stage Ghost presentation for verification'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 2cd66423f339c94798c9b353fb9124e9b6b3c9d9
          if ! git merge --no-commit --no-ff origin/main; then
            for path in $(git diff --name-only --diff-filter=U); do
              case "$path" in
                app/page.tsx|app/tools/ghost/page.tsx|app/tools/page.tsx|content/pages.ts|content/locales/de-metadata.ts)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *) echo "Unreviewed merge conflict: $path"; exit 1 ;;
              esac
            done
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/site.spec.ts')
          t = p.read_text()
          assert 'exposes v0.2.0 evidence and fits mobile and desktop' in t
          t = t.replace('page.getByRole("link", { name: "v0.2.0 Release", exact: true }),', 'page.getByRole("link", { name: "v0.2.0 Release", exact: true }).first(),')
          p.write_text(t)
          p = Path('docs/ghost-v0.2-site-evidence.md')
          p.write_text(p.read_text() + '\nThe concurrent main update `2cd66423f339c94798c9b353fb9124e9b6b3c9d9` was reconciled before validation. Its development launcher and additional browser assertions are preserved. The keyboard test now uses structural selectors rather than obsolete copy. Public GitHub HTTP 429 responses are not treated as success: exact resource paths or uploaded release assets are independently checked through the GitHub REST API.\n')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Format and stage the final file inventory
        run: |
          pnpm exec prettier --write content/ghost.ts app/tools/ghost/page.tsx app/page.tsx app/tools/page.tsx content/pages.ts content/locales/de-metadata.ts tests/ghost.test.ts tests/e2e/ghost.spec.ts tests/e2e/site.spec.ts docs/ghost-v0.2-site-evidence.md
          git add content/ghost.ts app/tools/ghost/page.tsx app/page.tsx app/tools/page.tsx content/pages.ts content/locales/de-metadata.ts tests/ghost.test.ts tests/e2e/ghost.spec.ts tests/e2e/site.spec.ts docs/ghost-v0.2-site-evidence.md
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Internal links
        run: pnpm links:internal
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser accessibility responsive and Ghost external-link tests
        env:
          GHOST_LINKS_TOKEN: ${{ github.token }}
        run: pnpm test:e2e
      - name: Verify no unrelated website changes
        run: |
          git diff origin/main --exit-code -- package.json pnpm-lock.yaml scripts/dev.mjs app/globals.css app/studio.css app/tools/replay/page.tsx components
          git diff HEAD --check
          git diff origin/main --stat
      - name: Commit verified source only to review branch
        run: |
          test "$GITHUB_REF" = refs/heads/ghost-v0.2-site-update
          git commit -m 'feat: update Ghost site for v0.2.0'
          git push origin HEAD:refs/heads/ghost-v0.2-site-update
          git rev-parse HEAD
      - name: Package final source and diff for review
        if: always()
        run: |
          mkdir -p /tmp/ghost-final-review
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=test-results --exclude=playwright-report -czf /tmp/ghost-final-review/website-source.tar.gz .
          git diff HEAD > /tmp/ghost-final-review/uncommitted.patch
          git status --short > /tmp/ghost-final-review/status.txt
          git rev-parse HEAD > /tmp/ghost-final-review/revision.txt
          if test -d test-results; then cp -R test-results /tmp/ghost-final-review/; fi
      - name: Export source and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghost-site-final-review
          path: /tmp/ghost-final-review/
          retention-days: 3
